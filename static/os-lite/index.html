  <script>
    // Forward input to the 3D scene around the monitor (camera + keyboard/mouse sounds).
    (function () {
      if (window.parent === window) return;
      var single = /[?&]app=/.test(location.search);
      if (single) document.documentElement.classList.add('single');
      // nested inside the React desktop: talk straight to the 3D scene at the top
      var target = single ? window.top : window.parent;
      var send = function (msg) { if (target !== window) target.postMessage(msg, '*'); };
      if (!single) addEventListener('mousemove', function (e) { send({ type: 'mousemove', clientX: e.clientX, clientY: e.clientY }); });
      addEventListener('mousedown', function () { send({ type: 'mousedown' }); });
      addEventListener('mouseup', function () { send({ type: 'mouseup' }); });
      addEventListener('keydown', function (e) { send({ type: 'keydown', key: e.key }); });
      addEventListener('keyup', function (e) { send({ type: 'keyup', key: e.key }); });
    })();
  </script>
  <!-- GoatCounter: only count /os/ when opened directly, not inside the 3D monitor -->
  <script>
    if (window.parent === window && !/[?&]app=/.test(location.search)) {
      window.goatcounter = { path: function (p) { return location.host + p } };
      var gc = document.createElement('script');
      gc.async = true; gc.src = 'https://gc.zgo.at/count.js';
      gc.setAttribute('data-goatcounter', 'https://clienterr.goatcounter.com/count');
      document.head.appendChild(gc);
    }
  </script>
