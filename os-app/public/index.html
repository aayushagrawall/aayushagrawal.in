<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#008080" />
  <meta name="description" content="AayushOS: the desktop inside Aayush Agrawal's 3D portfolio. Projects, resume, experience and contact." />
  <base target="_parent">
  <link rel="canonical" href="https://aayushagrawal.in/os/" />
  <script>
    // This desktop needs a mouse and a big screen; phones get the touch-friendly AayushOS Lite.
    if (window.parent === window && (window.innerWidth < 900 || (window.matchMedia && matchMedia('(pointer: coarse)').matches && window.innerWidth < 1100))) {
      location.replace('/os-lite/');
    }
  </script>
  <link rel="shortcut icon" href="./favicon.ico" type="image/x-icon">
  <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
  <!-- <link rel="preload" as="font" href="../src/assets/fonts/MSSansSerif.ttf" type="font/woff2" crossorigin="anonymous"> -->
  <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
  <title>AayushOS - Aayush Agrawal</title>
  <script>
    window.onload = () => {
      addEventListener('mousemove', (event) => {
        window.parent.postMessage({ clientX: event.clientX, clientY: event.clientY, type: 'mousemove' }, '*');
      });
      addEventListener('mousedown', (event) => {
        window.parent.postMessage({ type: 'mousedown' }, '*');
      });
      addEventListener('mouseup', (event) => {
        window.parent.postMessage({ type: 'mouseup' }, '*');
      });
      addEventListener('keydown', (event) => {
        window.parent.postMessage({ type: 'keydown', key: event.key }, '*');
      });
      addEventListener('keyup', (event) => {
        window.parent.postMessage({ type: 'keyup', key: event.key }, '*');
      });
    };
  </script>
  <!-- GoatCounter: only count /os/ when opened directly, not inside the 3D monitor -->
  <script>
    if (window.parent === window) {
      window.goatcounter = { path: function (p) { return location.host + p } };
      var gc = document.createElement('script');
      gc.async = true; gc.src = 'https://gc.zgo.at/count.js';
      gc.setAttribute('data-goatcounter', 'https://clienterr.goatcounter.com/count');
      document.head.appendChild(gc);
    }
  </script>
</head>

<body>
  <noscript>
    <h1>Aayush Agrawal</h1>
