  <script>
    (function () {
      try {
        var coarse = window.matchMedia && matchMedia('(pointer: coarse)').matches;
        var small = Math.min(screen.width, screen.height) < 768;
        var skip = sessionStorage.getItem('aa-3d-anyway') === '1';
        if (coarse && small && !skip) {
          var g = document.getElementById('phone-gate');
          g.hidden = false; g.style.display = 'flex';
          document.getElementById('phone-gate-3d').onclick = function () {
            try { sessionStorage.setItem('aa-3d-anyway', '1'); } catch (e) {}
            g.style.display = 'none';
          };
        }
      } catch (e) {}
    })();
